name: PuzzleGetaway
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  PuzzleGetaway:
    type: application
    platform: iOS
    sources:
      # Everything under PuzzleGetaway/ except Resources is compiled/bundled by folder: new files need no edits here.
      - path: PuzzleGetaway
        excludes:
          - "Resources/**"
      # Resources is bundled as a FOLDER REFERENCE copied to `<app>/Content/Resources/...` (Levels, Pools, Art,
      # Destinations.json). It must NOT sit at the bundle root: a root-level `Resources` directory makes CFBundle
      # treat the app as a legacy bundle and the install fails with "Missing bundle ID".
      # Use ResourceLocator (Core/Content.swift) to find the files.
      - path: PuzzleGetaway/Resources
        type: folder
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Content
    info:
      path: Generated/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Puzzle Getaway
        CFBundleName: Puzzle Getaway
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleDefault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.puzzlegetaway
        PRODUCT_NAME: PuzzleGetaway
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  PuzzleGetawayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PuzzleGetawayTests
    dependencies:
      - target: PuzzleGetaway
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.puzzlegetaway.tests
        GENERATE_INFOPLIST_FILE: YES
  PuzzleGetawayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PuzzleGetawayUITests
    dependencies:
      - target: PuzzleGetaway
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.puzzlegetaway.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PuzzleGetaway:
    build:
      targets:
        PuzzleGetaway: all
    test:
      targets:
        - PuzzleGetawayTests
        - PuzzleGetawayUITests
      gatherCoverageData: false
    run:
      config: Debug
